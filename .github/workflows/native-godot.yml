name: Native Godot validation
on:
  push:
    branches: [native-godot]
  pull_request:
    branches: [native-godot]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Import and parse project
        run: godot --headless --editor --path . --quit
      - name: Run rules tests
        run: godot --headless --path . --script res://tests/test_rules.gd
